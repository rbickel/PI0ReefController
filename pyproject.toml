[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reef-controller"
version = "0.1.0"
description = "Raspberry Pi Zero aquarium probe → MQTT bridge"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=2.1.0",
    "PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
